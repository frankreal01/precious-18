services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: precious, POSTGRES_PASSWORD: precious, POSTGRES_DB: precious18 }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precious -d precious18"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3mock:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: precious-media
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: ["127.0.0.1:9090:9090"]
    volumes: [s3data:/s3mockroot]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://precious:precious@db:5432/precious18
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      S3_ENDPOINT: http://s3mock:9090
      S3_BUCKET: precious-media
    ports: ["3000:3000"]
    restart: unless-stopped
    command: sh -c "npx prisma db push && npx prisma db seed && node server.js"
volumes: { pgdata: {}, s3data: {} }
